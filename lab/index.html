body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
header{padding:10px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}

button.go{background:#1f5fbf;border-color:#2c74e0}

label{color:var(--dim);font-size:13px}

<script type="text/plain" id="ex-Freenove 16.1.1 hello/counter">/*
  Sketch 16.1.1
  Display the string on LCD1602

  modified 2016/5/13
  by http://www.freenove.com
*/
#include <LiquidCrystal_I2C.h>

// initialize the library with the numbers of the interface pins
LiquidCrystal_I2C lcd(0x27, 16, 2);

void setup() {
  if (!i2CAddrTest(0x27)) {
    lcd = LiquidCrystal_I2C(0x3F, 16, 2);
  }
  lcd.init();                // initialize the lcd
  lcd.backlight();           // Turn on backlight
  lcd.print("hello, world!");// Print a message to the LCD
}

void loop() {
  // (note: line 1 is the second row, since counting begins with 0):
  lcd.setCursor(0, 1);// set the cursor to column 0, line 1
  // print the number of seconds since reset:
  lcd.print("Counter:");
  lcd.print(millis() / 1000);
}

bool i2CAddrTest(uint8_t addr) {
  Wire.begin();
  Wire.beginTransmission(addr);
  if (Wire.endTransmission() == 0) {
    return true;
  }
  return false;
}</script>
<script type="text/plain" id="ex-Custom chars + degree sign">#include <LiquidCrystal_I2C.h>
LiquidCrystal_I2C lcd(0x27, 16, 2);

byte heart[8] = {B00000, B01010, B11111, B11111, B01110, B00100, B00000, B00000};
byte smile[8] = {B00000, B01010, B01010, B00000, B10001, B01110, B00000, B00000};

void setup() {
  lcd.init();
  lcd.backlight();
  lcd.createChar(0, heart);
  lcd.createChar(1, smile);
  lcd.setCursor(0, 0);       // createChar leaves the address counter in CGRAM: must set cursor
  lcd.print("I ");
  lcd.write(0);
  lcd.print(" Freenove ");
  lcd.write(1);
  lcd.setCursor(0, 1);
  lcd.print("Temp: 23.5");
  lcd.write(0xDF);           // degree sign in A00 ROM
  lcd.print("C");
}

void loop() {}</script>

<script type="text/plain" id="ex-Progress bar">#include <LiquidCrystal_I2C.h>
LiquidCrystal_I2C lcd(0x27, 16, 2);

void makeBars() {
  for (int n = 0; n < 6; n++) {
    byte b[8];
    byte row = 0;
    for (int i = 0; i < n; i++) row |= (B10000 >> i);
    for (int r = 0; r < 8; r++) b[r] = row;
    lcd.createChar(n, b);
  }
}

void setup() {
  lcd.init();
  lcd.backlight();
  makeBars();
  lcd.setCursor(0, 0);
  lcd.print("Uploading...");
}

int pct = 0;
void loop() {
  int cols = pct * 80 / 100;   // 16 chars * 5 px
  lcd.setCursor(0, 1);
  for (int c = 0; c < 16; c++) {
    int fill = cols - c * 5;
    lcd.write(byte(fill >= 5 ? 5 : (fill > 0 ? fill : 0)));
  }
  lcd.setCursor(13, 0);
  if (pct < 10) lcd.print(" ");
  if (pct < 100) lcd.print(" ");
  lcd.print(pct);
  pct = (pct + 1) % 101;
  delay(60);
}</script>
<script type="text/plain" id="ex-Cursor + blink">#include <LiquidCrystal_I2C.h>
LiquidCrystal_I2C lcd(0x27, 16, 2);

void setup() {
  lcd.init();
  lcd.backlight();
  lcd.print("cursor()");
  lcd.setCursor(0, 1);
  lcd.print("blink()");
}

void loop() {
  lcd.setCursor(8, 0); lcd.cursor(); lcd.noBlink(); delay(2500);
  lcd.setCursor(7, 1); lcd.noCursor(); lcd.blink(); delay(2500);
}</script>
